[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "polyxrd-converter"
description = "PolyXRD Converter —— XRD 谱图格式转换器 (多厂商 RAW 自动识别)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PolyXRD Team", email = "sshztx@outlook.com" }]
keywords = ["XRD", "powder diffraction", "RAW", "format converter", "Rigaku", "Bruker", "Scintag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.5",
]
dynamic = ["version"]

[project.gui-scripts]
polyxrd-converter = "polyxrd_converter.app:run"

[tool.setuptools.dynamic]
version = { attr = "polyxrd_converter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyxrd_converter = ["resources/*"]
